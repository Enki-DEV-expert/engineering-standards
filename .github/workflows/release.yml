name: Manual npm release (disabled until configured)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-reviewed-release to authorize publication of this signed tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    if: vars.NPM_RELEASE_ENABLED == 'true' && inputs.confirm == 'publish-reviewed-release' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Check release identity and version
        run: node scripts/release-check.mjs
      - run: npm run package:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-reviewed-package
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-reviewed-package
          path: artifact
      - name: Verify and publish the tested artifact with OIDC provenance
        working-directory: artifact
        run: |
          sha256sum --check SHA256SUMS
          npm publish ./*.tgz --access public --provenance --ignore-scripts
