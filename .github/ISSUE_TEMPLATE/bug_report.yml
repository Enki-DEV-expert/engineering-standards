name: Bug report
description: Report a reproducible, non-sensitive installer or documentation problem.
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md. Do not include secrets or private paths."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, CLI version, agent/version and installation scope.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction in an isolated temporary directory
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Exit status, dry-run output and relevant diagnostics. No credentials or backup contents.
